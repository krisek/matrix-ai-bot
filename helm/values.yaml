replicaCount: 1

image:
  repository: ghcr.io/krisek/matrix-ai-bot
  tag: latest
  pullPolicy: Always

service:
  name: matrix-ai-bot

# Secret holding MATRIX_URL, MATRIX_USER, MATRIX_PASS (shared with wisebalance-bot)
matrixSecretName: wisebalance-secrets

bot:
  callword: "@ai"
  maxHistory: 20          # messages remembered per room; "<callword> /reset" clears
  maxToolRounds: 8
  maxToolResultChars: 8000
  llmTimeoutSeconds: 120

llm:
  # Any OpenAI-compatible endpoint. Default: Gemini.
  baseUrl: https://generativelanguage.googleapis.com/v1beta/openai
  model: gemini-2.5-flash
  systemPrompt: "You are a helpful assistant in a Matrix chat. Keep answers concise."
  apiKeySecret:
    name: matrix-ai-bot-secrets
    key: LLM_API_KEY

# MCP servers over streamable HTTP. URLs (which may contain a secret path)
# and tokens come from Secrets. Tools are writable unless readOnly: true.
mcp:
  servers: []
  # - name: audioloader
  #   urlSecret: {name: matrix-ai-bot-secrets, key: MCP_AUDIOLOADER_URL}
  #   bearerSecret: {name: matrix-ai-bot-secrets, key: MCP_AUDIOLOADER_TOKEN}  # optional
  #   readOnly: false                 # true = only tools with readOnlyHint
  #   allowedTools: []                # optional allowlist of tool names

resources: {}
